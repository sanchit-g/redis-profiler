redis:
  address: localhost:6379
  # password: ""
  # recommended: set via environment variable instead of plaintext here
  # export REDISPROFILER_REDIS_PASSWORD=your_password
  db: 0
  tls: false

scanner:
  batch_size: 100
  workers: 20

groups:
  - name: "User Sessions"
    pattern: "session:*"
  - name: "Product Cache"
    pattern: "product:cache:*"
  - name: "Rate Limiters"
    pattern: "ratelimit:*"

output:
  format: table
  sort_by: memory
  cliff_threshold: 15
  cliff_window_minutes: 10
  cliff_ignore_groups:
    - "Rate Limiters"